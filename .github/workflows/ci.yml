# Build, test and describe every change (UC-09, SC-08, SR-11).
#
# - The API's whole test suite runs, including the authorisation matrix and the ArchUnit rules;
#   any failure fails the build.
# - npm audit fails the build on a high or critical vulnerability in a runtime dependency.
# - A CycloneDX SBOM is produced for the API and for the front end and kept with the run.
# - Actions are pinned to a commit, not to a tag that could be moved.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and SBOM
        working-directory: api
        run: mvn -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-api
          path: api/target/classes/META-INF/sbom/application.cdx.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Fail on known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check and build
        run: npm run build
      - name: SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file sbom-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: web/sbom-web.cdx.json

  images:
    needs: [api, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the container images
        run: docker compose build web api collector setup
