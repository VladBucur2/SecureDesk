# SecureDesk log collector (SC-09).
#
# - TLS 1.3 only, with the internal CA; the sender must present a certificate whose name is
#   "securedesk-api" (x509/name), so a forged sender on the network is refused (BoK 6.2.4: syslog
#   itself does not authenticate senders, so the transport and the collector must).
# - Each event is stored twice: the raw RFC 5424 line as received, and one JSON object per line
#   for the SIEM, with the time of receipt and the sender's address added.
# - Received control characters are escaped (rsyslog's default), so nothing can forge a record.

global(
    workDirectory="/var/spool/rsyslog"
    defaultNetstreamDriver="gtls"
    defaultNetstreamDriverCAFile="/run/secrets/tls/ca.crt"
    defaultNetstreamDriverCertFile="/run/secrets/tls/collector.crt"
    defaultNetstreamDriverKeyFile="/run/secrets/tls/collector.key"
)

module(load="imtcp"
    streamDriver.name="gtls"
    streamDriver.mode="1"
    streamDriver.authMode="x509/name"
    permittedPeer=["securedesk-api"]
    gnutlsPriorityString="NORMAL:-VERS-ALL:+VERS-TLS1.3")

input(type="imtcp" port="6514" ruleset="securedesk")

template(name="siemJson" type="list") {
    constant(value="{\"received\":\"")
    property(name="timegenerated" dateFormat="rfc3339")
    constant(value="\",\"from\":\"")
    property(name="fromhost-ip")
    constant(value="\",\"hostname\":\"")
    property(name="hostname" format="json")
    constant(value="\",\"msgid\":\"")
    property(name="msgid" format="json")
    constant(value="\",\"event\":")
    property(name="msg" droplastlf="on")
    constant(value="}\n")
}

template(name="rawLine" type="string" string="%rawmsg-after-pri%\n")

ruleset(name="securedesk") {
    action(type="omfile" file="/var/log/securedesk/audit.jsonl" template="siemJson")
    action(type="omfile" file="/var/log/securedesk/audit-rfc5424.log" template="rawLine")
    action(type="omfile" file="/dev/stdout" template="siemJson")
}
