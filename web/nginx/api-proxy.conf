# To the API in the application zone: TLS 1.3, the API's certificate checked against the
# internal CA and its name, and Nginx's own client certificate (the API requires one), so only
# this proxy can talk to the API (SR-04).
proxy_pass https://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_ssl_protocols TLSv1.3;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /run/secrets/tls/ca.crt;
proxy_ssl_name api;
proxy_ssl_server_name on;
proxy_ssl_certificate /run/secrets/tls/client.crt;
proxy_ssl_certificate_key /run/secrets/tls/client.key;
proxy_ssl_session_reuse on;

# X-Forwarded-For is overwritten with the address Nginx saw, never appended to, so a client
# cannot put a false address into the audit trail.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID $request_id;
proxy_hide_header X-Powered-By;
proxy_read_timeout 30s;
proxy_connect_timeout 5s;
