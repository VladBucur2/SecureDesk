# SecureDesk reverse proxy in the DMZ (BoK 2.3, SC-10, SC-12). The only component reachable
# from outside; it serves the React build and forwards /api to the application zone.

server_tokens off;

# Anti-automation per client address (SC-02, SC-10). The sign-in steps get the mfa-poc's
# limit: about one request per three seconds with a burst of ten; Nginx answers 429 before the
# request reaches the API.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# One JSON object per request (BoK 5.3.3, 6.2.5), with the request id the API also logs.
# $uri carries no query string, so search terms and filters stay out of the access log.
log_format json escape=json '{"ts":"$time_iso8601","stream":"access","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent"}';
access_log /dev/stdout json;
error_log /dev/stderr warn;

upstream api {
    server api:8443;
    keepalive 16;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # SR-04: TLS 1.3 only on the outside.
    ssl_certificate /run/secrets/tls/server.crt;
    ssl_certificate_key /run/secrets/tls/server.key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Body and time limits (SC-10).
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn perip 50;

    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;

    # The sign-in steps that check a credential.
    location ~ ^/api/auth/(login|mfa|enrol|password|reauth)$ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Uploads: the only requests with a large body (SC-05).
    location ~ ^/api/(tickets|queue)/[0-9a-f-]+/attachments$ {
        client_max_body_size 11m;
        limit_req zone=upload burst=5 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Nothing else is proxied: the actuator and any other path of the API stay unreachable.
    location /actuator {
        return 404;
    }

    # Built assets carry a content hash in their name and never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The single-page application: every other path is a client-side route.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
