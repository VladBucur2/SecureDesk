# Tests: H2 in MySQL mode, migrated by the same Flyway scripts as production (without the
# MySQL-only grants), so every test run also checks the schema against the entities.
spring.datasource.url=jdbc:h2:mem:securedesk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Test-only keys, generated for this repository and used nowhere else.
securedesk.crypto.pepper.current=k1
securedesk.crypto.pepper.keys.k1=LTldroFZylbOLyCX/njA9UV1C2Fnub4eft/1psrLkfA=
securedesk.crypto.totp.current=k1
securedesk.crypto.totp.keys.k1=lT1WlCmU8rjI8V7rT2RFLs9DGjOyfgIfwjIb+z1EchY=

# Scheduled jobs are started by the tests themselves.
securedesk.audit.verify-initial-delay=PT24H
securedesk.retention.cron=-
