# SecureDesk API. Values here are safe defaults; secrets are never in this file.
spring.application.name=securedesk-api

# Secrets arrive as files, one per property, under /run/secrets/config (configtree), for example
# /run/secrets/config/securedesk.db.password. Never in the image, the code or an .env file (SR-06).
spring.config.import=optional:configtree:/run/secrets/config/

# Requests on virtual threads: the progressive login delay and the Argon2id slot queue hold no
# platform thread while they wait.
spring.threads.virtual.enabled=true

server.port=8080
server.shutdown=graceful
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=12MB

# Session cookie (UC-01): opaque server-side session, HttpOnly, Secure, SameSite=Strict, the
# __Host- prefix (only ever set over HTTPS, for the whole host, by this host), short idle timeout.
server.servlet.session.timeout=15m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=__Host-SD-SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/

# Generic error responses (SC-04).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# The application account: DML only, INSERT and SELECT on the audit table (SC-06). TLS to MySQL,
# with the server's certificate and name checked against the internal CA (SR-04).
spring.datasource.url=jdbc:mysql://mysql:3306/securedesk?sslMode=VERIFY_IDENTITY&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=securedesk_app
spring.datasource.password=${securedesk.db.password:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# The schema belongs to the migrate service; the API only checks that it matches.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# Query timeout in milliseconds (SC-10).
spring.jpa.properties.jakarta.persistence.query.timeout=5000

# Unknown JSON fields are an error, not ignored: a requester who adds "status" or "assigneeId"
# to a body gets 400 and an audit event, on top of the field not existing in the DTO (T-07).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Upload limits (SC-05); Nginx enforces the same body size in front.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Production level is INFO (BoK 6.2.5). ForbiddenLoggersFilter keeps the dangerous loggers quiet
# even if this is changed.
logging.level.root=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

securedesk.base-url=https://securedesk.localhost:8443
securedesk.crypto.pepper.current=k1
securedesk.crypto.totp.current=k1
