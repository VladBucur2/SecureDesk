# The laboratory deployment (docker-compose.yml): TLS on every hop (SR-04).

# Only Nginx talks to the API, over TLS with a client certificate (mutual TLS). The API's
# certificate and the CA that signed Nginx's certificate are mounted under /run/secrets/tls.
server.port=8443
server.ssl.bundle=server
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3
spring.ssl.bundle.pem.server.keystore.certificate=file:/run/secrets/tls/api.crt
spring.ssl.bundle.pem.server.keystore.private-key=file:/run/secrets/tls/api.key
spring.ssl.bundle.pem.server.truststore.certificate=file:/run/secrets/tls/ca.crt

# The client address is the one Nginx saw. Nginx overwrites X-Forwarded-For rather than
# appending to it, and nothing but Nginx can reach this port.
server.forward-headers-strategy=native

# Health for the container check only: plain HTTP on the container's own loopback.
management.server.port=8081
management.server.address=127.0.0.1
management.server.ssl.enabled=false

# Audit events to the collector over syslog/TLS with a client certificate (SC-09).
securedesk.audit.forward.enabled=true
securedesk.audit.forward.host=collector
securedesk.audit.forward.port=6514
spring.ssl.bundle.pem.syslog.keystore.certificate=file:/run/secrets/tls/api-syslog.crt
spring.ssl.bundle.pem.syslog.keystore.private-key=file:/run/secrets/tls/api-syslog.key
spring.ssl.bundle.pem.syslog.truststore.certificate=file:/run/secrets/tls/ca.crt

# Ticket notifications (UC-08): SMTP with STARTTLS required and the server name checked.
securedesk.mail.enabled=true
securedesk.mail.from=securedesk@securedesk.localhost
spring.mail.host=mail
spring.mail.port=1025
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
